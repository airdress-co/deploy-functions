# Run with `prek run --all-files` (or pre-commit). CI runs the same.
# Hook revisions are pinned by commit SHA; the tag each one is sits beside it.
# commit-msg is installed beside pre-commit so `prek install` (and
# `just hooks-install-all`) also checks the commit message.
default_install_hook_types: [pre-commit, commit-msg]
# Hooks without `stages` stay pre-commit only; otherwise every hook would
# also run against the commit message file.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x]

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: 805f85e558841bf4d852335e036b33d2b26be1cc # frozen: v1.7.12.25
    hooks:
      - id: actionlint
        # The examples' workflows are linted as well as this repository's.
        files: ^(\.github/workflows/|examples/[^/]+/\.github/workflows/).*\.ya?ml$

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10 # frozen: v0.23.3
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      # Every commit message is a Conventional Commit (owner, 2026-10-09).
      # Vendored unchanged from airdress-ops (`just conventional-commit-vendor`).
      - id: conventional-commit
        name: conventional commit message
        entry: python3 scripts/check-conventional-commit.py
        language: system
        stages: [commit-msg]

      - id: conventional-commit-tests
        name: conventional commit checker tests
        entry: python3 -m unittest discover -s scripts -p test_check_conventional_commit.py
        language: system
        pass_filenames: false
        files: ^scripts/(check-conventional-commit|test_check_conventional_commit)\.py$

      - id: no-internal-refs
        name: no internal document numbers
        # This repository is public: internal process identifiers (design,
        # runbook and research-record numbers) must not appear in it.
        entry: '(?i)\b(spec|rb|rdr|rcp)[_-]?[0-9]{3}\b'
        language: pygrep
        exclude: ^\.pre-commit-config\.yaml$

      - id: no-ai-attribution
        name: no AI tool references
        entry: '(?i)\b(claude|anthropic|copilot co-authored)\b'
        language: pygrep
        exclude: ^\.pre-commit-config\.yaml$
